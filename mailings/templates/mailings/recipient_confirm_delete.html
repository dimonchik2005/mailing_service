{% extends "mailings/base.html" %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3">
                Удаление получателя
            </h1>

            <p>
                Удалить {{ object.full_name }}?
            </p>

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Удалить
                </button>

                <a
                    href="{% url 'mailings:recipient_detail' object.pk %}"
                    class="btn btn-outline-secondary"
                >
                    Отмена
                </a>
            </form>
        </div>
    </div>
{% endblock %}
