<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Сервис рассылок
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    {% block extra_css %}
    {% endblock %}
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a
                class="navbar-brand"
                href="{% url 'mailings:home' %}"
            >
                Mailing Service
            </a>

            {% if user.is_authenticated %}
                <div class="navbar-nav me-auto">
                    <a
                        class="nav-link"
                        href="{% url 'mailings:recipient_list' %}"
                    >
                        Получатели
                    </a>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <span class="text-light">
                        {{ user.email }}
                    </span>

                    <form
                        method="post"
                        action="{% url 'users:logout' %}"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-outline-light btn-sm"
                        >
                            Выйти
                        </button>
                    </form>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
