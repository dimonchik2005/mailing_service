{% extends "mailings/base.html" %}

{% block title %}
    Удаление рассылки
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3">Удаление рассылки</h1>

                    <p>
                        Удалить рассылку
                        <strong>
                            «{{ object.message.subject }}»
                        </strong>?
                    </p>

                    <p class="text-danger">
                        История попыток этой рассылки также будет удалена.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Удалить
                        </button>

                        <a
                            href="{% url 'mailings:mailing_detail' object.pk %}"
                            class="btn btn-outline-secondary"
                        >
                            Отмена
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
